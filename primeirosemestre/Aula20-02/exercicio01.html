<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Trabalho - Cristiano Ronaldo</title>
    <style>
        /* Alterado para 750px conforme solicitado */
        .altura-carrossel {
            height: 750px; 
            object-fit: cover;
            object-position: top; 
        }

        /* Ajuste opcional: em telas pequenas (telemóvel), 750px pode ficar muito grande, 
           então esta regra ajuda a adaptar se necessário */
        @media (max-width: 768px) {
            .altura-carrossel {
                height: 500px;
            }
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">CR7 - O MELHOR</a>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5" style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://e0.pxfuel.com/wallpapers/185/848/desktop-wallpaper-cristiano-ronaldo-real-madrid-celebration-cr7-celebration.jpg'); background-size: cover; background-position: center;">
        <div class="container">
            <h1 class="display-4 fw-bold">Cristiano Ronaldo</h1>
            <p class="lead">O maior artilheiro da história do futebol.</p>
        </div>
    </header>

    <main class="container my-5">
        
        <div id="meuCarrossel" class="carousel slide mb-5 shadow" data-bs-ride="carousel">
            <div class="carousel-inner rounded-4">
                <div class="carousel-item active">
                    <img src="https://placar.com.br/_next/image/?url=https%3A%2F%2Fplacar.com%2Fwp-content%2Fuploads%2F2026%2F02%2FHBJKilyWwAAtWhu-2.jpeg&w=3840&q=75" 
                         class="d-block w-100 altura-carrossel" alt="Portugal">
                </div>
                <div class="carousel-item">
                    <img src="https://s3.glbimg.com/v1/AUTH_bc8228b6673f488aa253bbcb03c80ec5/audiopub-episodes/bs/2021/L/W/eVqM23TBSWhmJ1KIFzrA/whatsapp-image-2021-06-23-at-20.08.19.jpeg" 
                         class="d-block w-100 altura-carrossel" alt="Salto">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#meuCarrossel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#meuCarrossel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>

        <div class="row text-center">
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-warning shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">5 Bolas de Ouro</h5>
                        <p class="card-text">Prémio de melhor jogador do mundo.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-warning shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">900+ Golos</h5>
                        <p class="card-text">O recordista absoluto em jogos oficiais.</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card h-100 border-warning shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">5 Champions</h5>
                        <p class="card-text">O rei da maior competição da Europa.</p>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">© 2026 Trabalho Escolar - Cristiano Ronaldo dos Santos Aveiro</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
